name: MATHIEU V1 CI

on:
  push:
    branches:
      - feature/mathieu-v1-foundation
  pull_request:
    branches:
      - feature/mathieu-v1-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathieu-v1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --prefer-offline --no-fund

      - name: Run unit tests
        run: npm test -- --reporter=dot

      - name: Typecheck and build
        run: npm run build
